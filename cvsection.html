/* ============================================================
   3. RENDER LOGIC
============================================================ */
let lang = "en";

function render() {
  const t = I18N[lang];

  document.getElementById('badgeText').textContent = t.badge;
  document.getElementById('langToggleText').textContent = t.toggleLabel;
  document.getElementById('nameText').textContent = t.name;
  document.getElementById('githubBtnText').textContent = t.ctaGithub;
  document.getElementById('portfolioBtnText').textContent = t.ctaPortfolio;
  document.getElementById('aboutTitle').textContent = t.aboutTitle;
  document.getElementById('aboutText').textContent = t.about;
  document.getElementById('expertiseTitle').textContent = t.expertiseTitle;
  document.getElementById('experienceTitle').textContent = t.experienceTitle;
  document.getElementById('educationTitle').textContent = t.educationTitle;
  document.getElementById('languagesTitle').textContent = t.languagesTitle;

  document.getElementById('githubBtn').href = LINKS.github;
  document.getElementById('portfolioBtn').href = LINKS.portfolio;

  // roles
  const rolesWrap = document.getElementById('rolesWrap');
  rolesWrap.innerHTML = "";
  t.roles.forEach(role => {
    const span = document.createElement('span');
    span.className = "text-xs sm:text-sm font-medium px-3 py-1.5 rounded-full bg-gradient-to-r from-indigo-500/15 to-fuchsia-500/15 border border-white/10 text-slate-200";
    span.textContent = role;
    rolesWrap.appendChild(span);
  });

  // expertise grid
  const expertiseGrid = document.getElementById('expertiseGrid');
  expertiseGrid.innerHTML = "";
  t.expertise.forEach(item => {
    const div = document.createElement('div');
    div.className = "rounded-2xl border border-white/10 bg-white/[0.03] p-4 sm:p-5 hover:border-indigo-400/30 hover:bg-white/[0.05] transition-colors";
    div.innerHTML = `<h3 class="font-bold text-sm sm:text-base text-white mb-1">${item.title}</h3><p class="text-slate-400 text-xs sm:text-sm">${item.desc}</p>`;
    expertiseGrid.appendChild(div);
  });

  // experience
  const experienceWrap = document.getElementById('experienceWrap');
  experienceWrap.innerHTML = "";
  t.experience.forEach(job => {
    const div = document.createElement('div');
    div.className = "rounded-2xl border border-white/10 bg-white/[0.03] p-5 sm:p-6";
    div.innerHTML = `
      <div class="flex items-start justify-between flex-wrap gap-2 mb-2">
        <h3 class="font-bold text-base sm:text-lg text-white">${job.role}</h3>
        <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-500/10 text-slate-300 border border-white/10 whitespace-nowrap">${job.period}</span>
      </div>
      <p class="text-slate-300 text-sm sm:text-[15px]">${job.company}</p>
    `;
    experienceWrap.appendChild(div);
  });

  // education
  const educationWrap = document.getElementById('educationWrap');
  educationWrap.innerHTML = "";
  t.education.forEach(edu => {
    const div = document.createElement('div');
    div.className = "rounded-2xl border border-white/10 bg-white/[0.03] p-5 sm:p-6";
    div.innerHTML = `
      <div class="flex items-start justify-between flex-wrap gap-2 mb-2">
        <h3 class="font-bold text-base sm:text-lg text-white">${edu.degree}</h3>
        <span class="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-400/20 whitespace-nowrap">${edu.status}</span>
      </div>
      <p class="text-slate-400 text-sm sm:text-[15px]">${edu.institute}</p>
    `;
    educationWrap.appendChild(div);
  });

  // languages
  const languagesWrap = document.getElementById('languagesWrap');
  languagesWrap.innerHTML = "";
  t.languages.forEach(l => {
    const div = document.createElement('div');
    div.className = "rounded-2xl border border-white/10 bg-white/[0.03] px-5 py-3.5";
    div.innerHTML = `<p class="font-bold text-sm text-white">${l.name}</p><p class="text-slate-400 text-xs mt-0.5">${l.level}</p>`;
    languagesWrap.appendChild(div);
  });
}

document.getElementById('langToggle').addEventListener('click', () => {
  lang = lang === "en" ? "bn" : "en";
  render();
});

render();
</script>
