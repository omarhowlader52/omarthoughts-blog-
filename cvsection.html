/* ============================================================
   3. STATE
============================================================ */
let lang = (function(){ try { return localStorage.getItem("o52-lang") || "bn"; } catch(e){ return "bn"; } })();
let theme = (function(){ try { return localStorage.getItem("o52-theme") || "dark"; } catch(e){ return "dark"; } })();

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderModalSection(section) {
  const box = el("div", "bg-[#111a2e] p-5 rounded-xl border border-gray-800/50 mb-4");
  box.appendChild(el("p", "mb-4 text-base font-bold text-white", section.icon + " " + section.title));
  const list = el("ul", "space-y-3");
  section.items.forEach((item) => {
    const idx = item.indexOf(":");
    const li = el("li", "text-sm leading-relaxed text-gray-400");
    if (idx > -1 && idx < 60) {
      const strong = el("span", "font-semibold text-emerald-400", item.slice(0, idx + 1) + " ");
      li.appendChild(strong);
      li.appendChild(document.createTextNode(item.slice(idx + 1).trim()));
    } else {
      li.textContent = item;
    }
    list.appendChild(li);
  });
  box.appendChild(list);
  return box;
}

function render() {
  const t = I18N[lang];

  document.getElementById('navBrand').textContent = t.nav.brand;
  document.getElementById('badgeText').textContent = t.badge;
  document.getElementById('nameText').textContent = t.name;

  document.getElementById('aboutText').textContent = t.about;
  document.getElementById('expertiseTitle').textContent = t.expertiseTitle;
  document.getElementById('experienceTitle').textContent = t.experienceTitle;
  document.getElementById('educationTitle').textContent = t.educationTitle;
  document.getElementById('languagesTitle').textContent = t.languagesTitle;

  document.getElementById('githubBtn').href = LINKS.github;
  document.getElementById('portfolioBtn').href = LINKS.portfolio;

  // roles
  const rolesWrap = document.getElementById('rolesWrap');

  // expertise

  });

  // experience
  const experienceWrap = document.getElementById('experienceWrap');
  experienceWrap.innerHTML = "";
  t.experience.forEach(job => {
    const div = el("div", "rounded-2xl border border-[var(--border-color)] bg-[var(--bg-card)] p-5 sm:p-6");

    div.appendChild(row);
    div.appendChild(el("p", "text-[var(--text-secondary)] text-sm sm:text-[15px]", job.company));

  // education
  const educationWrap = document.getElementById('educationWrap');
  educationWrap.innerHTML = "";

    const div = el("div", "rounded-2xl border border-[var(--border-color)] bg-[var(--bg-card)] p-5 sm:p-6");

  const languagesWrap = document.getElementById('languagesWrap');

    div.appendChild(el("p", "text-[var(--text-secondary)] text-xs mt-0.5", l.level));
    languagesWrap.appendChild(div);

  // project card
  document.getElementById('projectLabel').textContent = t.projectLabel;
  document.getElementById('projectCatLabel').textContent = t.project.catLabel;
  document.getElementById('projectTitle').textContent = t.project.title;
  document.getElementById('projectDesc').textContent = t.project.desc;

  document.getElementById('footerBrand').textContent = t.footer.brand;

  // modal (kept in sync even while closed)
  document.getElementById('modalGreeting').textContent = t.modal.greeting;
  document.getElementById('modalTagline').textContent = t.modal.tagline;
  document.getElementById('modalPara1').textContent = t.modal.para1;
  document.getElementById('modalPara2').textContent = t.modal.para2;

  const sectionsWrap = document.getElementById('modalSections');
  sectionsWrap.innerHTML = "";
  t.modal.sections.forEach(section => sectionsWrap.appendChild(renderModalSection(section)));

  const modalCta = document.getElementById('modalCta');
  modalCta.textContent = t.modal.cta;
  modalCta.href = "https://wa.me/" + WHATSAPP_NUMBER;

  // language switch visual state
  const highlight = document.getElementById('langHighlight');
  const labelEN = document.getElementById('langLabelEN');
  const labelBN = document.getElementById('langLabelBN');
  if (lang === "bn") {
    highlight.classList.add("is-bn");
    labelEN.style.color = "var(--text-muted)";
    labelBN.style.color = "var(--accent-contrast)";
  } else {
    highlight.classList.remove("is-bn");
    labelEN.style.color = "var(--accent-contrast)";
    labelBN.style.color = "var(--text-muted)";
  }
}

function toggleLang() {
  lang = lang === "en" ? "bn" : "en";
  try { localStorage.setItem("o52-lang", lang); } catch (e) {}
  render();
}

function applyTheme() {
  const root = document.documentElement;
  if (theme === "light") {
    root.classList.add("light");
    document.getElementById('iconSun').classList.add("hidden");
    document.getElementById('iconMoon').classList.remove("hidden");
  } else {
    root.classList.remove("light");
    document.getElementById('iconSun').classList.remove("hidden");
    document.getElementById('iconMoon').classList.add("hidden");
  }
  render();
}

function toggleTheme() {
  theme = theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("o52-theme", theme); } catch (e) {}
  applyTheme();
}

/* ============================================================
   4. MODAL CONTROL
============================================================ */
let lastFocusedEl = null;

function openModal() {
  lastFocusedEl = document.activeElement;
  document.getElementById('modalOverlay').classList.add("is-open");
  document.body.style.overflow = "hidden";
  document.addEventListener("keydown", handleModalKeydown);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove("is-open");
  document.body.style.overflow = "";
  document.removeEventListener("keydown", handleModalKeydown);
  if (lastFocusedEl && typeof lastFocusedEl.focus === "function") lastFocusedEl.focus();
}

function handleModalKeydown(e) {
  if (e.key === "Escape") closeModal();
}

document.getElementById('modalOverlay').addEventListener("click", function (e) {
  if (e.target === this) closeModal();
});

document.getElementById('projectCard').addEventListener("click", openModal);
document.getElementById('projectDetailsBtn').addEventListener("click", function (e) {
  e.stopPropagation();
  openModal();
});
document.getElementById('projectLiveBtn').addEventListener("click", function (e) {
  e.stopPropagation();
});

/* ============================================================
   5. INIT
============================================================ */
applyTheme();
