<html lang="en">
<head>
<meta charset="UTF-8" />

<style>
  :root {
    --bg-page: #020617;
    --bg-card: rgba(255,255,255,0.03);
    --bg-card-outline: rgba(16,185,129,0.08);
    --bg-input: rgba(255,255,255,0.04);
    --bg-form: rgba(255,255,255,0.02);
    --bg-toggle: rgba(255,255,255,0.03);
    --bg-option: #020617;
    --bg-nav: rgba(2,6,23,0.75);
    --border-color: #1f2937;
    --border-strong: rgba(16,185,129,0.3);
    --border-strong-hover: rgba(52,211,153,0.6);
    --text-primary: #ffffff;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --accent: #34d399;
    --accent-hover: #6ee7b7;
    --accent-contrast: #020617;
    --dot-rgb: 52,211,153;
    --dot-opacity: 0.07;
    --glow-opacity: 0.10;
  }
  html.light {
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --bg-card-outline: rgba(5,150,105,0.05);
    --bg-input: #ffffff;
    --bg-form: #ffffff;
    --bg-toggle: #ffffff;
    --bg-option: #ffffff;
    --bg-nav: rgba(248,250,252,0.8);
    --border-color: #e5e7eb;
    --border-strong: rgba(5,150,105,0.3);
    --border-strong-hover: rgba(5,150,105,0.55);
    --text-primary: #0f172a;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
    --accent: #059669;
    --accent-hover: #047857;
    --accent-contrast: #ffffff;
    --dot-rgb: 5,150,105;
    --dot-opacity: 0.05;
    --glow-opacity: 0.06;
  }
  body {
    background-color: var(--bg-page);
    color: var(--text-primary);
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  .dot-grid {
    background-image: radial-gradient(circle at 1px 1px, rgba(var(--dot-rgb), 1) 1px, transparent 0);
    background-size: 36px 36px;
    opacity: var(--dot-opacity);
    transition: opacity 0.35s ease;
  }
  .glow-orb { opacity: var(--glow-opacity); transition: opacity 0.35s ease; }
  * { transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; }

  /* ---------- NAVBAR LANGUAGE SWITCH ---------- */
  #langHighlight {
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #langHighlight.is-bn { transform: translateX(44px); }

  /* ---------- MODAL ---------- */
  #modalOverlay {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  #modalOverlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  #modalPanel {
    transform: translateY(18px) scale(0.97);
    opacity: 0;
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
  }
  #modalOverlay.is-open #modalPanel {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  @media (prefers-reduced-motion: reduce) {
    #modalOverlay, #modalPanel, #langHighlight, .card-hover { transition: none !important; }
  }
</style>
</head>

<body class="bg-[var(--bg-page)] text-[var(--text-primary)]">

</nav>

/* ---------- STATE ---------- */
let currentLang = (function(){ try { return localStorage.getItem("o52-lang") || "en"; } catch(e){ return "en"; } })();
let currentTheme = (function(){ try { return localStorage.getItem("o52-theme") || "dark"; } catch(e){ return "dark"; } })();

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderLabeledRow(value) {
  const wrap = el("div", "mb-5 last:mb-0");
  const idx = value.indexOf(":");
  if (idx > -1 && idx < 40) {
    const label = value.slice(0, idx + 1);
    const rest = value.slice(idx + 1).trim();
    const p = el("p", "text-sm leading-relaxed text-[var(--text-secondary)]");
    const strong = el("span", "font-semibold text-[var(--accent)]", label + " ");
    p.appendChild(strong);
    p.appendChild(document.createTextNode(rest));
    wrap.appendChild(p);
  } else {
    wrap.appendChild(el("p", "text-sm leading-relaxed text-[var(--text-secondary)]", value));
  }
  return wrap;
}

function renderCard(cat) {
  const isSolid = cat.variant === "solid";
  const card = el(
    "article",
    "card-hover group flex flex-col rounded-2xl border p-8 sm:p-10 border-[var(--border-color)] " +
      (isSolid
        ? "bg-[var(--bg-card)] hover:border-[var(--border-strong-hover)]"
        : "bg-[var(--bg-card-outline)] shadow-[0_0_50px_-18px_rgba(16,185,129,0.35)] hover:border-[var(--border-strong-hover)]") +
      (cat.openModal ? " cursor-pointer" : "")
  );
  if (!isSolid) card.style.borderColor = "var(--border-strong)";
  if (cat.openModal) {
    card.addEventListener("click", openModal);
  }

  const iconWrap = el("div", "mb-6 flex h-12 w-12 items-center justify-center rounded-xl border border-[var(--border-strong)] bg-[var(--bg-card-outline)] text-[var(--accent)]");
  iconWrap.innerHTML = cat.icon;
  card.appendChild(iconWrap);

  card.appendChild(el("span", "mb-3 block text-xs font-semibold uppercase tracking-wider text-[var(--accent)]", cat.label));
  card.appendChild(el("p", "mb-8 text-sm leading-relaxed text-[var(--text-secondary)]", cat.subtitle));
  card.appendChild(el("h3", "mb-8 text-2xl font-semibold leading-snug text-[var(--text-primary)] sm:text-[1.65rem]", cat.project));

  const dl = el("div", "mb-8 space-y-5 border-t border-[var(--border-color)] pt-8");
  cat.rows.forEach((row) => dl.appendChild(renderLabeledRow(row.value)));
  card.appendChild(dl);

  const toolWrap = el("div", "mb-10 flex flex-wrap gap-2");
  cat.tools.forEach((tool) => {
    toolWrap.appendChild(el("span", "rounded-full border border-[var(--border-color)] bg-[var(--bg-card)] px-3.5 py-1.5 text-xs font-medium text-[var(--text-secondary)]", tool));
  });
  card.appendChild(toolWrap);

  const actionRow = el("div", "mt-auto flex flex-wrap items-center gap-3");

  const link = document.createElement("a");
  link.href = cat.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.className =
    "inline-flex w-fit items-center gap-1.5 rounded-full px-6 py-3 text-sm font-medium transition-transform duration-200 group-hover:translate-x-0.5 " +
    (isSolid
      ? "bg-[var(--accent)] text-[var(--accent-contrast)] hover:bg-[var(--accent-hover)]"
      : "border border-[var(--border-strong)] text-[var(--accent)] hover:bg-[var(--bg-card-outline)]");
  link.innerHTML =
    cat.cta +
    ' <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M7 7h10v10"/></svg>';
  link.addEventListener("click", (e) => e.stopPropagation());
  actionRow.appendChild(link);

  if (cat.detailsCta) {
    const detailsBtn = el("button", "inline-flex w-fit items-center gap-1.5 rounded-full border border-[var(--border-color)] px-6 py-3 text-sm font-medium text-[var(--text-secondary)] hover:border-[var(--border-strong-hover)] hover:text-[var(--text-primary)]", cat.detailsCta);
    detailsBtn.type = "button";
    detailsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openModal();
    });
    actionRow.appendChild(detailsBtn);
  }

  card.appendChild(actionRow);

  return card;
}

function renderModalSection(section) {
  const box = el("div", "bg-[#111a2e] p-5 rounded-xl border border-gray-800/50 mb-4");
  box.appendChild(el("p", "mb-4 text-sm font-semibold text-white", section.icon + " " + section.title));

  const list = el("ul", "space-y-3");
  section.items.forEach((item) => {
    list.appendChild(el("li", "text-sm leading-relaxed text-gray-400", item));
  });
  box.appendChild(list);

  return box;
}

function renderContent() {
  const t = COPY[currentLang];
  document.documentElement.setAttribute("dir", t.dir);

  document.getElementById("navBrand").textContent = t.nav.brand;

  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("heading").textContent = t.heading;
  document.getElementById("intro").textContent = t.intro;

  const cardsWrap = document.getElementById("cards");
  cardsWrap.innerHTML = "";
  t.categories.forEach((cat) => cardsWrap.appendChild(renderCard(cat)));

  document.getElementById("contactHeading").textContent = t.contact.heading;
  document.getElementById("contactSub").textContent = t.contact.subheading;

  document.getElementById("fieldName").placeholder = t.contact.name;
  document.getElementById("fieldEmail").placeholder = t.contact.email;
  document.getElementById("fieldMessage").placeholder = t.contact.messagePlaceholder;
  document.getElementById("submitLabel").textContent = t.contact.submit;

  const select = document.getElementById("fieldService");
  select.innerHTML = "";
  const placeholderOpt = el("option", "", t.contact.service);
  placeholderOpt.value = "";
  placeholderOpt.disabled = true;
  placeholderOpt.selected = true;
  placeholderOpt.style.background = "var(--bg-option)";
  placeholderOpt.style.color = "var(--text-muted)";
  select.appendChild(placeholderOpt);
  t.contact.serviceOptions.forEach((opt) => {
    const o = el("option", "", opt);
    o.value = opt;
    o.style.background = "var(--bg-option)";
    o.style.color = "var(--text-primary)";
    select.appendChild(o);
  });

  // footer
  document.getElementById("footerBrand").textContent = t.footer.brand;
  document.getElementById("footerHeading").textContent = t.footer.heading;
  document.getElementById("footerCopyright").textContent = t.footer.copyright;

  // modal — kept in sync even while closed
  document.getElementById("modalName").textContent = t.modal.name;
  document.getElementById("modalRole").textContent = t.modal.role;
  document.getElementById("modalBio").textContent = t.modal.bio;

  const sectionsWrap = document.getElementById("modalSections");
  sectionsWrap.innerHTML = "";
  t.modal.sections.forEach((section) => sectionsWrap.appendChild(renderModalSection(section)));

  const modalCta = document.getElementById("modalCta");
  modalCta.textContent = t.modal.cta;
  modalCta.href = "https://wa.me/" + WHATSAPP_NUMBER;

  // language switch visual state
  const highlight = document.getElementById("langHighlight");
  const labelEN = document.getElementById("langLabelEN");
  const labelBN = document.getElementById("langLabelBN");
  if (currentLang === "bn") {
    highlight.classList.add("is-bn");
    labelEN.style.color = "var(--text-muted)";
    labelBN.style.color = "var(--accent-contrast)";
  } else {
    highlight.classList.remove("is-bn");
    labelEN.style.color = "var(--accent-contrast)";
    labelBN.style.color = "var(--text-muted)";
  }
}

function toggleLang() {
  currentLang = currentLang === "en" ? "bn" : "en";
  try { localStorage.setItem("o52-lang", currentLang); } catch (e) {}
  renderContent();
}

function applyTheme() {
  const root = document.documentElement;
  if (currentTheme === "light") {
    root.classList.add("light");
    document.getElementById("iconSun").classList.add("hidden");
    document.getElementById("iconMoon").classList.remove("hidden");
  } else {
    root.classList.remove("light");
    document.getElementById("iconSun").classList.remove("hidden");
    document.getElementById("iconMoon").classList.add("hidden");
  }
  renderContent();
}

function toggleTheme() {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  try { localStorage.setItem("o52-theme", currentTheme); } catch (e) {}
  applyTheme();
}

/* ---------- MODAL CONTROL ---------- */
let lastFocusedEl = null;

function openModal() {
  lastFocusedEl = document.activeElement;
  const overlay = document.getElementById("modalOverlay");
  overlay.classList.add("is-open");
  document.body.style.overflow = "hidden";
  document.addEventListener("keydown", handleModalKeydown);
}

function closeModal() {
  const overlay = document.getElementById("modalOverlay");
  overlay.classList.remove("is-open");
  document.body.style.overflow = "";
  document.removeEventListener("keydown", handleModalKeydown);
  if (lastFocusedEl && typeof lastFocusedEl.focus === "function") lastFocusedEl.focus();
}

function handleModalKeydown(e) {
  if (e.key === "Escape") closeModal();
}

document.getElementById("modalOverlay").addEventListener("click", function (e) {
  if (e.target === this) closeModal();
});

document.getElementById("contactForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const name = document.getElementById("fieldName").value;
  const email = document.getElementById("fieldEmail").value;
  const service = document.getElementById("fieldService").value;
  const message = document.getElementById("fieldMessage").value;
  const serviceLine = service ? "\nService: " + service : "";
  const text = "Hi, I'm " + (name || "—") + " (" + (email || "—") + ")." + serviceLine + "\n\n" + (message || "");
  const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
  window.open(url, "_blank");
});

/* ---------- INIT ---------- */
applyTheme();
</script>
